name: Build mod

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build mod jar
        run: gradle deploy --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TsunamiMod
          path: build/libs/TsunamiMod.jar
