pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url 'https://www.jitpack.io' }
    }
}

if (JavaVersion.current().ordinal() < JavaVersion.VERSION_17.ordinal()) {
    throw new GradleException("JDK 17 or higher is required. Yours: ${System.getProperty('java.version')}")
}

rootProject.name = 'TsunamiMod'
